<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBA Snake Game</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <style>
        /* --- CSS DESIGN --- */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            position: relative;
        }

        /* ONLINE STATUS */
        #status-anzeige {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        .status-online {
            background-color: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }
        .status-offline {
            background-color: rgba(255, 50, 50, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
            box-shadow: 0 0 10px rgba(255, 50, 50, 0.2);
        }

        /* LAYOUT CONTAINER */
        .view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px; /* Breiter für Startseite + Tabelle */
        }
        .active { display: flex; }

        /* --- NEU: STARTSEITE LAYOUT (Links & Rechts) --- */
        .start-container {
            display: flex;
            flex-wrap: wrap; /* Damit es auf Handy umbricht */
            justify-content: center;
            gap: 50px;
            width: 100%;
            align-items: flex-start;
        }

        .start-left, .start-right {
            flex: 1;
            min-width: 300px; /* Mindestbreite, sonst Umbruch */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* EINGABEBEREICH */
        .input-group { margin: 20px 0; text-align: center; }
        input {
            padding: 10px;
            font-size: 1.2rem;
            background: #222;
            border: 2px solid #808080;
            color: white;
            text-align: center;
            width: 200px;
        }
        button.start-btn {
            padding: 15px 30px;
            font-size: 1.5rem;
            background: #000;
            color: #00ff00;
            border: 2px solid #808080;
            cursor: pointer;
            margin-top: 20px;
        }
        button.start-btn:hover { background: #222; }

        /* --- NEU: TABELLEN DESIGN --- */
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 400px;
            border: 1px solid #808080;
            color: white;
        }
        th, td {
            border: 1px solid #444;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #222;
            color: #00ff00;
        }
        tr:nth-child(even) { background-color: #111; } /* Zebra-Streifen */


        /* --- GAME DESIGN --- */
        #game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
            border-bottom: 2px solid #808080;
            padding-bottom: 5px;
        }
        canvas {
            border: 4px solid #808080;
            background-color: #111;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            max-width: 95vw;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            margin-top: 20px;
        }
        .ctrl-btn {
            width: 60px;
            height: 60px;
            background: #333;
            border: 2px solid #808080;
            color: white;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
        }
        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }

        @media (max-width: 1200px) {
            .ctrl-btn { width: 70px; height: 70px; }
            /* Auf kleinen Screens Tabelle unter Eingabe schieben */
            .start-container { flex-direction: column; align-items: center; }
            .start-right { width: 90%; }
        }
    </style>
</head>
<body>

    <div id="status-anzeige" class="status-online">● Online</div>

    <div id="start-view" class="view active">
        <h1>MBA SNAKE</h1>
        
        <div class="start-container">
            <div class="start-left">
                <div class="input-group">
                    <p>Bitte Namen eingeben:</p>
                    <input type="text" id="playerName" placeholder="Spielername">
                </div>
                <button class="start-btn" onclick="startGame()">START GAME</button>
            </div>

            <div class="start-right">
                <h3 style="color: #808080;">TOP 10 BESTENLISTE</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Score</th>
                            <th>Datum</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="game-view" class="view">
        <div id="game-info">
            <span id="displayName">Spieler: -</span>
            <span>Score: <span id="score">0</span></span>
            </div>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <button class="ctrl-btn up" onclick="changeDirection({keyCode: 38})">▲</button>
            <button class="ctrl-btn left" onclick="changeDirection({keyCode: 37})">◀</button>
            <button class="ctrl-btn down" onclick="changeDirection({keyCode: 40})">▼</button>
            <button class="ctrl-btn right" onclick="changeDirection({keyCode: 39})">▶</button>
        </div>
        
        <button onclick="location.reload()" style="margin-top:20px; background:none; color:#888; border:1px solid #333; padding:5px;">Neustart</button>
    </div>

    <script>
        /* SERVICE WORKER */
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(console.error);
        }

        /* ONLINE STATUS */
        function updateStatus() {
            const anzeige = document.getElementById('status-anzeige');
            if (navigator.onLine) {
                anzeige.innerText = "● Online";
                anzeige.className = "status-online";
            } else {
                anzeige.innerText = "○ Offline";
                anzeige.className = "status-offline";
            }
        }
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();


        /* --- BESTENLISTE LOGIK --- */
        // Wir laden die Liste beim Start
        let leaderboard = JSON.parse(localStorage.getItem('snakeLeaderboard')) || [];
        renderLeaderboard();

        function renderLeaderboard() {
            let tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = ""; // Leer machen

            // Tabelle aufbauen (Top 10)
            leaderboard.forEach(entry => {
                let row = `<tr>
                    <td>${entry.name}</td>
                    <td>${entry.score}</td>
                    <td>${entry.date}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
            
            if(leaderboard.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3'>Noch keine Einträge</td></tr>";
            }
        }

        function saveScore(name, points) {
            let date = new Date().toLocaleDateString('de-DE'); // TT.MM.JJJJ
            
            // Neuen Eintrag hinzufügen
            leaderboard.push({ name: name, score: points, date: date });

            // Sortieren (Höchster Score zuerst)
            leaderboard.sort((a, b) => b.score - a.score);

            // Nur die Top 10 behalten
            leaderboard = leaderboard.slice(0, 10);

            // Speichern
            localStorage.setItem('snakeLeaderboard', JSON.stringify(leaderboard));
        }


        /* --- GAME LOGIK --- */
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let box = 20;
        let snake = [];
        let food;
        let score = 0;
        let d;
        let game;
        let playerName = "";

        function startGame() {
            let inputName = document.getElementById('playerName').value;
            if(inputName.trim() === "") {
                alert("Bitte Namen eingeben!");
                return;
            }
            playerName = inputName;
            document.getElementById('displayName').innerText = playerName;

            document.getElementById('start-view').classList.remove('active');
            document.getElementById('game-view').classList.add('active');

            initGame();
        }

        function initGame() {
            snake = [];
            snake[0] = { x: 9 * box, y: 10 * box };
            score = 0;
            d = undefined;
            createFood();
            if(game) clearInterval(game);
            game = setInterval(draw, 100);
        }

        function createFood() {
            food = {
                x: Math.floor(Math.random() * 19 + 1) * box,
                y: Math.floor(Math.random() * 19 + 1) * box
            };
            for(let part of snake){
                if(part.x == food.x && part.y == food.y) createFood();
            }
        }

        document.addEventListener("keydown", changeDirection);
        function changeDirection(event) {
            let key = event.keyCode;
            if(key == 37 && d != "RIGHT") d = "LEFT";
            else if(key == 38 && d != "DOWN") d = "UP";
            else if(key == 39 && d != "LEFT") d = "RIGHT";
            else if(key == 40 && d != "UP") d = "DOWN";
        }

        function collision(head, array) {
            for(let i = 0; i < array.length; i++) {
                if(head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        function draw() {
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i = 0; i < snake.length; i++) {
                ctx.fillStyle = "#00ff00";
                ctx.strokeStyle = "#000000";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "#ff0000";
            ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if(d == "LEFT") snakeX -= box;
            if(d == "UP") snakeY -= box;
            if(d == "RIGHT") snakeX += box;
            if(d == "DOWN") snakeY += box;

            if(snakeX == food.x && snakeY == food.y) {
                score++;
                createFood();
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                
                // GAME OVER:
                clearInterval(game);
                
                // 1. Score speichern
                saveScore(playerName, score);
                
                // 2. Alert anzeigen
                alert("Game Over! Score: " + score);
                
                // 3. Seite neu laden (Tabelle wird dann aktualisiert angezeigt)
                location.reload(); 
                return;
            }

            snake.unshift(newHead);
            document.getElementById("score").innerText = score;
        }
    </script>
</body>
</html>
