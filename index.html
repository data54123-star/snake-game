<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBA Snake Game</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <style>
        /* --- CSS DESIGN (Identisch zu vorher) --- */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            position: relative;
        }

        /* ONLINE STATUS */
        #status-anzeige {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        .status-online {
            background-color: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }
        .status-offline {
            background-color: rgba(255, 50, 50, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
            box-shadow: 0 0 10px rgba(255, 50, 50, 0.2);
        }

        /* LAYOUT */
        .view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
        }
        .active { display: flex; }

        .start-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 50px;
            width: 100%;
            align-items: flex-start;
        }

        .start-left, .start-right {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group { margin: 20px 0; text-align: center; }
        input {
            padding: 10px;
            font-size: 1.2rem;
            background: #222;
            border: 2px solid #808080;
            color: white;
            text-align: center;
            width: 200px;
        }
        button.start-btn {
            padding: 15px 30px;
            font-size: 1.5rem;
            background: #000;
            color: #00ff00;
            border: 2px solid #808080;
            cursor: pointer;
            margin-top: 20px;
        }
        button.start-btn:hover { background: #222; }

        /* TABELLE */
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 400px;
            border: 1px solid #808080;
            color: white;
        }
        th, td {
            border: 1px solid #444;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #222;
            color: #00ff00;
        }
        tr:nth-child(even) { background-color: #111; }

        /* GAME */
        #game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
            border-bottom: 2px solid #808080;
            padding-bottom: 5px;
        }
        canvas {
            border: 4px solid #808080;
            background-color: #111;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            max-width: 95vw;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            margin-top: 20px;
        }
        .ctrl-btn {
            width: 60px;
            height: 60px;
            background: #333;
            border: 2px solid #808080;
            color: white;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
        }
        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }

        @media (max-width: 1200px) {
            .ctrl-btn { width: 70px; height: 70px; }
            .start-container { flex-direction: column; align-items: center; }
            .start-right { width: 90%; }
        }
    </style>
</head>
<body>

    <div id="status-anzeige" class="status-online">● Online</div>

    <div id="start-view" class="view active">
        <h1>MBA SNAKE</h1>
        <div class="start-container">
            <div class="start-left">
                <div class="input-group">
                    <p>Bitte Namen eingeben:</p>
                    <input type="text" id="playerName" placeholder="Spielername">
                </div>
                <button class="start-btn" onclick="startGame()">START GAME</button>
            </div>
            <div class="start-right">
                <h3 style="color: #808080;">TOP 10 BESTENLISTE</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Score</th>
                            <th>Datum</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="game-view" class="view">
        <div id="game-info">
            <span id="displayName">Spieler: -</span>
            <span>Score: <span id="score">0</span></span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <button class="ctrl-btn up" onclick="changeDirection({keyCode: 38})">▲</button>
            <button class="ctrl-btn left" onclick="changeDirection({keyCode: 37})">◀</button>
            <button class="ctrl-btn down" onclick="changeDirection({keyCode: 40})">▼</button>
            <button class="ctrl-btn right" onclick="changeDirection({keyCode: 39})">▶</button>
        </div>
        <button onclick="abortGame()" style="margin-top:20px; background:none; color:#888; border:1px solid #333; padding:5px;">Zurück zum Menü</button>
    </div>
